<script>
  (function () {
    const savedTheme = localStorage.getItem('notes-app-theme');
    const theme = savedTheme ? JSON.parse(savedTheme) : 'light';
    if (theme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  })();
</script>
